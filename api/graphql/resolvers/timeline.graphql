extend type Query {
  """
  Get a list of media, ordered first by day, then by album if multiple media was found for the same day.
  """
  myTimeline(
    paginate: Pagination,
    onlyFavorites: Boolean,
    "Only fetch media shot on or after this date"
    fromDate: Time,
    "Only fetch media shot on or before this date"
    toDate: Time
  ): [Media!]! @isAuthorized
}
